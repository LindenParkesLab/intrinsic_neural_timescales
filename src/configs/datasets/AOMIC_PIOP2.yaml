name: AOMIC_PIOP2
paths:
  base: /mnt/lindenmp_bignas/lindenmp/research_data/AOMIC_PIOP2
  rawdata_subdir: bids
  derivatives_subdir: derivatives
modalities:
  MRI3T:
    tr: 2.0
    data_subdir: xcpd
    # No session level in this dataset (config.py registers it with sessions: [None]).
    dir_template: "sub-{subject_id}/func"
    # acq-seq is the only acquisition in PIOP2 -- verified across all 896 timeseries files --
    # so it is written literally rather than promoted to a ScanInfo entity. Adding an `acq`
    # field to ScanInfo would change build_scan_string, every cached output filename and every
    # exported registry in the project, for a token that takes one value here. PIOP1, which has
    # acq-seq *and* acq-mb3, resolves acq per task through task_params instead (AOMIC_PIOP1.yaml).
    filename_template: "sub-{subject_id}_task-{task}_acq-seq_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .tsv
    # Exact template, not a glob: the events filename is fully determined, so a missing file
    # should be an error rather than a silent no-match. restingstate has no events file
    # anywhere in the dataset, which is what validate_scan_registry's rest branch requires.
    task_events_handler: bids_tsv
    task_events_file_template: "sub-{subject_id}_task-{task}_acq-seq_events.tsv"
    task_events_use_glob: false
behavior:
  handler: aomic_piop2
rbc: false
subject_id_rawdata_transform: null
