name: HBN
paths:
  base: /mnt/storage_ssd_raid/research_data/RBC/HBN
  rawdata_subdir: bids
  derivatives_subdir: derivatives
modalities:
  MRI3T:
    tr: 0.8
    data_subdir: rbc_cpac/cpac_RBCv0
    dir_template: "sub-{subject_id}/ses-{session}/func"
    # run-1 (not run-01) is part of the RBC/CPAC naming convention for HBN.
    filename_template: "sub-{subject_id}_ses-{session}_task-{task}_run-1_atlas-{seg}_space-{space}_reg-36Parameter_desc-Mean_timeseries{ext}"
    file_ext: .1D
    # Rest-only dataset: no task event validation.
    task_events_handler: null
behavior:
  handler: hbn_rbc
rbc: true
subject_id_rawdata_transform: null
