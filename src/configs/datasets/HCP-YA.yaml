name: HCP-YA
paths:
  base: /mnt/lindenmp_bignas/lindenmp/research_data/HCP_YA
  rawdata_subdir: HCP_1200
  derivatives_subdir: derivatives
modalities:
  MRI3T:
    tr: 0.72
    data_subdir: parcellated_data
    dir_template: "sub-{subject_id}/ses-{session}/func"
    filename_template: "sub-{subject_id}_ses-{session}_task-{task}_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .ptseries.nii
    task_events_handler: hcp_fmri
  MRI7T:
    tr: 1.0
    data_subdir: parcellated_data_7T
    dir_template: "sub-{subject_id}/ses-{session}/func"
    filename_template: "sub-{subject_id}_ses-{session}_task-{task}_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .ptseries.nii
    task_events_handler: hcp_7t_movie
  MEG:
    tr: 0.001966  # 1 / 508.63 Hz sampling rate
    data_subdir: parcellated_data_meg
    dir_template: "sub-{subject_id}/ses-{session}/func"
    filename_template: "sub-{subject_id}_ses-{session}_task-{task}_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .ptseries.npy
    task_events_handler: hcp_meg
behavior:
  handler: hcp_unrestricted_restricted
rbc: false
subject_id_rawdata_transform: null
