name: PNC
paths:
  base: /mnt/storage_ssd_raid/research_data/RBC/PNC
  rawdata_subdir: bids
  derivatives_subdir: derivatives
modalities:
  MRI3T:
    tr: 3.0
    data_subdir: xcp-d
    dir_template: "sub-{subject_id}/ses-{session}/func"
    # Primary filename template (no acquisition label; matches frac2back, idemo).
    # Fallback adds acq-singleband, used for the resting-state scan.
    filename_template: "sub-{subject_id}_ses-{session}_task-{task}_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    filename_template_fallbacks:
      - "sub-{subject_id}_ses-{session}_task-{task}_acq-singleband_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .tsv
    task_events_handler: bids_tsv
    task_events_file_template: "sub-{subject_id}_ses-{session}_task-{task}*_events.tsv"
    task_events_use_glob: true
behavior:
  handler: pnc_rbc
rbc: true
subject_id_rawdata_transform: null
