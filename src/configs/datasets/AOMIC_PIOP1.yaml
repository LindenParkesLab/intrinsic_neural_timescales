name: AOMIC_PIOP1
paths:
  base: /mnt/lindenmp_bignas/lindenmp/research_data/AOMIC_PIOP1
  rawdata_subdir: bids
  derivatives_subdir: derivatives
modalities:
  MRI3T:
    # Fallback only -- every task below sets its own TR.
    tr: 2.0
    data_subdir: xcpd
    # No session level in this dataset (config.py registers it with sessions: [None]).
    dir_template: "sub-{subject_id}/func"
    # PIOP1 mixes two acquisitions in one session: restingstate and faces are multiband
    # (acq-mb3, TR 0.75 s), the other four tasks sequential (acq-seq, TR 2.0 s). Each task has
    # exactly one acq -- verified across all 1206 Schaefer4007 timeseries files -- so acq is a
    # function of task and is resolved per task from task_params rather than promoted to a
    # ScanInfo entity. Scan strings and cache filenames are therefore unchanged in form; the
    # per-task TR reaches them through the tr- token.
    filename_template: "sub-{subject_id}_task-{task}_acq-{acq}_space-{space}_seg-{seg}_stat-mean_timeseries{ext}"
    file_ext: .tsv
    # Exact template, not a glob, as for PIOP2. restingstate has no events file anywhere in the
    # dataset, which is what validate_scan_registry's rest branch requires.
    task_events_handler: bids_tsv
    task_events_file_template: "sub-{subject_id}_task-{task}_acq-{acq}_events.tsv"
    task_events_use_glob: false
    # TRs checked against RepetitionTime in both the BIDS sidecars and XCP-D's denoised JSONs.
    # A task missing from this block has no {acq} and fails validation rather than guessing.
    task_params:
      restingstate:  {acq: mb3, tr: 0.75}
      faces:         {acq: mb3, tr: 0.75}
      anticipation:  {acq: seq, tr: 2.0}
      emomatching:   {acq: seq, tr: 2.0}
      gstroop:       {acq: seq, tr: 2.0}
      workingmemory: {acq: seq, tr: 2.0}
behavior:
  handler: aomic_piop1
rbc: false
subject_id_rawdata_transform: null
